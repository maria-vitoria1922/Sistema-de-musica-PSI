{% extends "base.html" %}

{% block title %}Editar Artista - Spotypobre{% endblock %}

{% block content %}

    <h2>Editar Artista</h2>

    <section class="form-section">
        <form action="{{ url_for('artistas.editar_artista', artista_id=artista.id) }}" method="POST">
            <div>
                <label for="nome">Nome do Artista:</label>
                <input type="text" name="nome" value="{{ artista.nome }}">
            </div>
            <button type="submit" class="btn">Salvar Alterações</button>
        </form>
    </section>

{% endblock %}
