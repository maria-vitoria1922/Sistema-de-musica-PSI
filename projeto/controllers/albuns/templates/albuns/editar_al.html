{% extends "base.html" %}

{% block title %}Editar Álbum - Spotypobre{% endblock %}

{% block content %}
    <h2>Editar Álbum</h2>

    <section class="form-section">
        <form action="{{ url_for('albuns.editar_al', album_id=album.id) }}" method="POST">
            <div>
                <label for="titulo">Titulo do Album:</label>
                <input type="text" name="titulo" value="{{ album.titulo }}">
            </div>
            <div>
                <label for="ano">Ano de Lançamento:</label>
                <input type="number" name="ano" value="{{ album.ano }}">
            </div>
            <button type="submit" class="btn">Salvar Alterações</button>
        </form>
    </section>

{% endblock %}
